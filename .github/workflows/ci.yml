name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # The repository is scaffolded before the code lands (M0 builds the walking
  # skeleton). Each job below is real and runs the moment its part of the tree
  # exists; until then it is skipped rather than faked green.
  detect:
    name: Detect what exists
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
      security-tests: ${{ steps.check.outputs.security-tests }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        shell: bash
        run: |
          # Detect against the tracked file list rather than shell globs: this is
          # depth-agnostic and needs no `shopt -s globstar` (a `**/…` glob does
          # NOT recurse in a default non-interactive bash, so it would miss files
          # in subdirectories and leave the build/test/security jobs silently
          # skipped — i.e. falsely green — once code lands).
          files="$(git ls-files)"
          backend=false
          frontend=false
          security=false
          if grep -qiE '\.(sln|csproj)$' <<< "$files"; then
            backend=true
          fi
          if grep -qE '(^|/)package\.json$' <<< "$files"; then
            frontend=true
          fi
          if grep -qE 'tests/.*([Ss]ecurity|[Ii]solation).*\.csproj$' <<< "$files"; then
            security=true
          fi
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "security-tests=$security"
          } >> "$GITHUB_OUTPUT"
          echo "Detected — backend=$backend frontend=$frontend security-tests=$security"

  docs:
    name: Docs and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The repo must stay self-contained: a contributor who only has this
      # repository needs all of these to get oriented.
      - name: Required documents are present
        shell: bash
        run: |
          missing=0
          for f in README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md \
                   LICENSE NOTICE CHARTER.md ROADMAP.md GLOSSARY.md PRIVACY.md; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::required document is missing"
              missing=1
            fi
          done
          exit $missing

      - name: No unfilled template placeholders
        shell: bash
        run: |
          if grep -rIn --exclude-dir=.git --exclude=ci.yml '{{[A-Z_]\+}}' .; then
            echo "::error::unfilled template placeholder left in the repository"
            exit 1
          fi

      # Secrets must come from env vars and GitHub Secrets, never the repo.
      - name: No committed secret files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$|\.pem$|\.p12$|\.pfx$'; then
            echo "::error::a secret-bearing file is tracked in git"
            exit 1
          fi

  backend:
    name: Backend (.NET)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # CI and contributors run the identical formatter version — it is pinned in
      # .config/dotnet-tools.json.
      - name: Restore tools
        run: dotnet tool restore

      - name: Format gate (CSharpier)
        run: dotnet csharpier check .

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  frontend:
    name: Front-end (Angular)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # The Storefront workspace lives under src/ (grouped with the .NET services,
    # not at repo root), so every step below runs from there.
    defaults:
      run:
        working-directory: src/Storefront
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/Storefront/package-lock.json

      - name: Install
        run: npm ci

      - name: Format gate (Prettier)
        run: npx prettier --check .

      - name: Lint gate (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadless

  # ---------------------------------------------------------------------------
  # The release gate. The project's core invariant is that no request reaches a
  # .NET service without passing through Oathkeeper, and no vendor can see
  # another vendor's data. A failure here blocks the merge — see CONTRIBUTING.md.
  # ---------------------------------------------------------------------------
  security-gate:
    name: Security gate (gateway bypass + vendor isolation)
    needs: detect
    if: needs.detect.outputs.security-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Testcontainers brings up the Ory components and PostgreSQL; Docker is
      # available on the GitHub-hosted runner out of the box.
      - name: Run the security test suite
        run: dotnet test --configuration Release --filter "Category=Security|Category=Isolation" --verbosity normal

  # ---------------------------------------------------------------------------
  # M1 DoD requires "Playwright covers the flows" to stay true over time, not
  # just at the moment a flow spec is written (issue #24) — so this gate boots
  # the same topology as the Docker Compose reference run (README.md "Run
  # locally", Option B) and runs the suite against it. Gated on backend+frontend
  # passing first: it is the most expensive job (image builds + full stack
  # boot), so a PR that's already red on formatting/build/unit tests fails fast
  # without paying for it.
  # ---------------------------------------------------------------------------
  e2e-gate:
    name: E2E gate (Playwright)
    needs: [detect, backend, frontend]
    if: needs.detect.outputs.backend == 'true' && needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Kratos flows are cookie-based and the SPA calls Kratos/the gateway
      # directly from the browser, so everything must share a base domain
      # (README.md "Run locally") — same hosts entries a contributor adds
      # locally, added here for the runner.
      - name: Add gatehouse.test hosts entries
        run: |
          echo "127.0.0.1 kratos.gatehouse.test" | sudo tee -a /etc/hosts
          echo "127.0.0.1 gateway.gatehouse.test" | sudo tee -a /etc/hosts
          echo "127.0.0.1 storefront.gatehouse.test" | sudo tee -a /etc/hosts

      # Only the dev-only, already-committed default (see .env.example) —
      # no real secret involved.
      - name: Configure environment
        run: cp .env.example .env

      # Requesting oathkeeper is enough: depends_on pulls in kratos and catalog,
      # which pull in postgres, kratos-migrate, and mailhog. storefront is
      # deliberately left out — Playwright runs its own dev server below, the
      # same way Option A (Aspire) works, so the spec always exercises the
      # latest build rather than whatever the storefront image last baked in.
      - name: Boot the backend (Docker Compose)
        run: docker compose up -d --build --wait oathkeeper

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/Storefront/package-lock.json

      - name: Install
        working-directory: src/Storefront
        run: npm ci

      - name: Resolve installed Playwright version
        id: playwright-version
        working-directory: src/Storefront
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: src/Storefront
        run: npx playwright install --with-deps chromium

      # Cache hit still needs the OS-level deps Playwright wants; only the
      # downloaded browser binaries are skipped.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: src/Storefront
        run: npx playwright install-deps chromium

      # Same command contributors run locally (README.md "Run locally",
      # CONTRIBUTING.md "Running tests) — playwright.config.ts starts the
      # Storefront dev server itself and points it at the stack booted above.
      - name: Run the e2e suite
        working-directory: src/Storefront
        run: npm run e2e

      - name: Tear down the backend
        if: always()
        run: docker compose down -v
