<h1>Create your account</h1>

@if (error()) {
  <p class="page-error">{{ error() }}</p>
}

@if (flow(); as currentFlow) {
  <app-kratos-flow-form [flow]="currentFlow" (submitted)="onSubmitted($event)" />
} @else if (!error()) {
  <p>Loading…</p>
}

<p><a routerLink="/login">Already have an account? Log in</a></p>
