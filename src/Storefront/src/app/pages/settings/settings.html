<div class="mx-auto max-w-md p-6">
  <h1 class="text-2xl font-semibold">Account settings</h1>

  @if (error()) {
    <p class="mt-4 text-red-700">{{ error() }}</p>
  }

  @if (flow(); as currentFlow) {
    <div class="mt-4">
      <app-kratos-flow-form [flow]="currentFlow" (submitted)="onSubmitted($event)" />
    </div>
  } @else if (!error()) {
    <p class="mt-4">Loading…</p>
  }
</div>
