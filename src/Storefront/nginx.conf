# Angular client-side routing (see app.routes.ts): unknown paths fall back to
# index.html rather than a 404, so a browser refresh on e.g. /products still works.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
