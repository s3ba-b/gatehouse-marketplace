dsn: memory

# Kratos ships no UI (CHARTER.md) — self-service flows redirect the browser to
# the Storefront app instead of Kratos's own (nonexistent) pages, and the
# cookie/CORS setup below is what makes that work: Kratos, Oathkeeper, and the
# Storefront dev server all live under subdomains of one shared base domain
# (see README.md "Run locally" for the required /etc/hosts entries), so the
# Kratos session cookie set on that shared domain is visible to Oathkeeper's
# cookie_session authenticator too.
serve:
  public:
    base_url: http://kratos.gatehouse.test:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://storefront.gatehouse.test:4200
      allow_credentials: true
  admin:
    base_url: http://127.0.0.1:4434/

selfservice:
  default_browser_return_url: http://storefront.gatehouse.test:4200/
  allowed_return_urls:
    - http://storefront.gatehouse.test:4200/

  methods:
    password:
      enabled: true
    # Shared by verification (and, later, recovery) — code is Kratos's recommended
    # strategy over the legacy "link" method (issue #25): the flow-node renderer
    # shows a code input the same way it shows any other field, no dedicated UI.
    code:
      enabled: true

  flows:
    error:
      ui_url: http://storefront.gatehouse.test:4200/error

    login:
      ui_url: http://storefront.gatehouse.test:4200/login
      lifespan: 10m

    registration:
      ui_url: http://storefront.gatehouse.test:4200/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session

    # Email trait is a verification address in both schemas (issue #23's schemas,
    # amended by issue #25), so as soon as registration creates an identity, Kratos
    # sends the verification mail on its own — no explicit post-registration hook
    # needed (https://www.ory.com/docs/kratos/self-service/flows/verify-email-account-activation).
    verification:
      enabled: true
      ui_url: http://storefront.gatehouse.test:4200/verification
      use: code
      lifespan: 1h
      after:
        default_browser_return_url: http://storefront.gatehouse.test:4200/products

    # Email trait is now also a recovery address in both schemas (issue #26),
    # so the code strategy shared with verification can drive this flow too —
    # same generic flow-node renderer, no dedicated recovery UI.
    recovery:
      enabled: true
      ui_url: http://storefront.gatehouse.test:4200/recovery
      use: code
      lifespan: 1h

    # Foundation for the settings page (issue #27) — enabled here already
    # because a successful recovery code has no flow-body outcome of its own;
    # Kratos unconditionally hands the browser to this flow instead for the
    # password-set step (verified against a real container, no "after" hook
    # involved). Issue #27 builds out the rest of this page (profile traits,
    # MFA method groups).
    settings:
      ui_url: http://storefront.gatehouse.test:4200/settings
      privileged_session_max_age: 15m

log:
  level: info
  format: text

# Session cookie set on the shared base domain rather than host-only on
# kratos.gatehouse.test, so the browser also sends it to
# gateway.gatehouse.test — that's what lets Oathkeeper's cookie_session
# authenticator see it. Same-site because every subdomain is same registrable
# domain (SameSite compares the "site", i.e. gatehouse.test, not the full
# host), so Lax works over plain http without a Secure/None cookie.
cookies:
  domain: gatehouse.test
  same_site: Lax

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    # Lowered from the default (12) so local registration/login stay fast; never use
    # in production.
    cost: 8

identity:
  # Two populations, two schemas (CHARTER.md "configurable identity schemas",
  # issue #23): retail customers register through the Storefront against the
  # default schema; a vendor-staff identity is created against the second one
  # (README.md "Identity schemas" — org membership/roles are Keto tuples, M2,
  # not traits here). Schema files are the single source of truth for their
  # traits — documented inline via each schema's title/description.
  default_schema_id: customer
  schemas:
    - id: customer
      url: file:///etc/config/kratos/customer.schema.json
    - id: vendor-staff
      url: file:///etc/config/kratos/vendor-staff.schema.json

# Dev mail sink (CHARTER.md "Email (dev)", issue #22) — "mailhog" resolves to the
# MailHog container on the shared network in both orchestrators (AppHost.cs's
# AddContainer("mailhog", ...) and docker-compose.yml's mailhog service), same
# single-source-of-truth approach as access-rules.json.tmpl. MailHog needs no
# credentials and doesn't speak STARTTLS, hence disable_starttls. Read delivered
# mail at http://localhost:8025 (README.md "Run locally"). Dev-only, never a real
# mail provider.
courier:
  smtp:
    connection_uri: smtp://mailhog:1025/?disable_starttls=true
    from_address: no-reply@gatehouse.test
    from_name: Gatehouse (dev)
