dsn: memory

serve:
  public:
    base_url: http://127.0.0.1:4433/
    cors:
      enabled: true
  admin:
    base_url: http://127.0.0.1:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:4433/
  allowed_return_urls:
    - http://127.0.0.1:4433/

  methods:
    password:
      enabled: true

  flows:
    error:
      ui_url: http://127.0.0.1:4433/error

    login:
      ui_url: http://127.0.0.1:4433/login
      lifespan: 10m

    registration:
      ui_url: http://127.0.0.1:4433/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session

    # Email verification and account recovery are M1 (CHARTER.md) — this schema has
    # no verification/recovery traits yet, so both flows stay off rather than
    # half-configured.
    verification:
      enabled: false

    recovery:
      enabled: false

log:
  level: info
  format: text

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    # Lowered from the default (12) so local registration/login stay fast; never use
    # in production.
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json
